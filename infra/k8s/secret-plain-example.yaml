# EXAMPLE ONLY -- for a cluster without External Secrets Operator.
#
# Do not commit a filled-in copy of this file. `stringData` is stored base64
# encoded in etcd, which is encoding, not encryption: anyone with `get secrets`
# in this namespace reads it in plaintext, and so does anyone with etcd access.
# Prefer externalsecret.yaml.
#
#   kubectl create secret generic fde-sor-db \
#     --namespace fde-sor \
#     --from-literal=FDE_DB_DSN="postgresql://ingest_user:...@host:5432/fde?sslmode=require"
#
# is equivalent and at least keeps the value out of the repository.
apiVersion: v1
kind: Secret
metadata:
  name: fde-sor-db
  namespace: fde-sor
type: Opaque
stringData:
  # Exactly one of these. FDE_DB_DSN wins if both are set (see fde_mcp.db's
  # DSN resolution order). The login must be a member of fde_ingest.
  FDE_DB_DSN: "postgresql://REPLACE_ME@REPLACE_ME:5432/fde?sslmode=require"
  # FDE_DB_SECRET_ARN: "arn:aws:secretsmanager:us-east-1:123456789012:secret:fde/db/ingest"
