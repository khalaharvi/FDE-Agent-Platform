# External Secrets Operator pulls the database login from Secrets Manager into
# a Kubernetes Secret, so the credential is never in a manifest, a git history,
# or a `kubectl apply` argument.
#
# Only the DATABASE secret is synced here. The per-customer system-of-record
# credentials (sor.adapter.secret_arn) and the per-engagement actor-hash salts
# are fetched at RUNTIME by boto3 using the pod's IRSA role -- deliberately, and
# it is worth being explicit about why: there is one salt and one credential per
# engagement, they change as customers are onboarded, and syncing them all into
# a cluster Secret would put every customer's credentials in one object that
# anyone with `get secrets` in this namespace can read. Fetching per invocation
# keeps the blast radius at "the engagements this pod actually processed".
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: fde-secrets-manager
  namespace: fde-sor
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1
      auth:
        jwt:
          serviceAccountRef:
            name: fde-sor
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: fde-sor-db
  namespace: fde-sor
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: fde-secrets-manager
    kind: SecretStore
  target:
    name: fde-sor-db
    creationPolicy: Owner
  data:
    # The login must be a member of fde_ingest. Login users are provisioned per
    # environment, never in migrations -- db/010 creates the ROLE, not a user.
    - secretKey: FDE_DB_SECRET_ARN
      remoteRef:
        key: fde/db/ingest-arn
---
# IRSA: the pod assumes this role for every boto3 call (Secrets Manager, SQS,
# S3, SNS). The same permissions the Lambda path needs -- see
# packages/fde-sor/src/fde_sor/deploy/iam/sor-lambda-permissions-policy.json,
# which is the authoritative list.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: fde-sor
  namespace: fde-sor
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::${AWS_ACCOUNT_ID}:role/fde-sor-irsa
