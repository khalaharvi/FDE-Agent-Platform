[project]
name = "fde-training"
version = "0.1.0"
description = "SFT export, GRPO rewards, rollout environment, and rival graders"
requires-python = ">=3.12"
dependencies = [
  "fde-mcp",
  "psycopg[binary,pool]>=3.2",
  "boto3>=1.35",
  "pydantic>=2.9",
  "structlog>=24.4",
  "numpy>=2.1",
]

[project.optional-dependencies]
# Heavy ML stack, deliberately optional. Nothing in an agent container image
# depends on fde-training, so `uv sync --package fde-agents` can never pull
# torch. Install with: uv sync --package fde-training --extra train
train = [
  "torch>=2.5",
  "transformers>=4.51",
  "trl>=0.12",
  "peft>=0.13",
  "datasets>=3.0",
  "accelerate>=1.0",
]

[project.scripts]
fde-training = "fde_training.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fde_training"]
