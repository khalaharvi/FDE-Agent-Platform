[project]
name = "fde-agents"
version = "0.2.0"
description = "Engagement, Workflow, and Development agents on Bedrock AgentCore"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = [
  "fde-mcp",
  "bedrock-agentcore>=1.19",
  "strands-agents>=1.50",
  "mcp>=1.27",
  "pydantic>=2.9",
  "boto3>=1.35",
  "psycopg[binary,pool]>=3.2",
  "structlog>=24.4",
  "opentelemetry-api>=1.28",
  "opentelemetry-sdk>=1.28",
]

[project.scripts]
fde-engagement = "fde_agents.engagement.agent:main"
fde-workflow = "fde_agents.workflow.agent:main"
fde-development = "fde_agents.development.agent:main"
fde-agents-deploy = "fde_agents.deploy.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fde_agents"]
