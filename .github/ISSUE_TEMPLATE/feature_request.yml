name: Feature request
description: Propose a capability, with the invariant in mind
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve
      description: Who hits it, how often.
    validations:
      required: true

  - type: textarea
    id: shape
    attributes:
      label: Proposed shape
      description: >-
        Which package/layer; sketch the surface — SQL function, MCP tool,
        CLI subcommand, console page.
    validations:
      required: true

  - type: textarea
    id: invariant-check
    attributes:
      label: Invariant check
      description: >-
        Does this give any agent role a new write path to `kg.*`, merging,
        publishing, or training labels? If yes, how do the four enforcement
        layers stay intact?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Out of scope / alternatives considered
    validations:
      required: false
