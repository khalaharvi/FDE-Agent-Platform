name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_FROZEN: "1"          # every uv command in this workflow refuses to resolve
  PYTHON_VERSION: "3.12"

jobs:
  # -------------------------------------------------------------------
  # Lint and types. Fast, no services, fails the PR before anything slow runs.
  # -------------------------------------------------------------------
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - run: uv sync --all-packages --frozen
      - name: ruff check
        run: uv run ruff check packages
      - name: ruff format
        run: uv run ruff format --check packages
      - name: mypy (strict)
        run: uv run mypy packages/fde-mcp/src packages/fde-agents/src
      - name: lockfile is current
        run: uv lock --check

  # -------------------------------------------------------------------
  # The database contract: migrations must apply IN ORDER on an EMPTY
  # database and all smoke tests must pass. This is the gate that protects
  # the platform's core invariant.
  # -------------------------------------------------------------------
  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        # pgvector >= 0.8.0 is a correctness requirement, not a perf one --
        # below it, filtered ANN queries silently return incomplete results.
        image: pgvector/pgvector:0.8.0-pg16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fde
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: fde
    steps:
      - uses: actions/checkout@v4
      - name: install psql client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: migrations + 16 smoke tests
        run: ./db/rebuild.sh fde
      - name: core invariants must hold
        # These six statements MUST all fail. If any succeeds, an agent can
        # write the graph or label its own training data, and the platform's
        # central guarantee is gone. Asserted here rather than trusted.
        run: |
          set -u
          fail=0
          assert_denied() {
            if psql -v ON_ERROR_STOP=1 -q -c "SET ROLE $1; $2" >/dev/null 2>&1; then
              echo "::error::INVARIANT BROKEN -- '$1' was able to: $2"; fail=1
            else
              echo "ok: $1 denied -- ${2:0:60}"
            fi
          }
          assert_denied fde_agent "INSERT INTO kg.node (engagement_id,node_key,node_type,label,commit_id) VALUES (gen_random_uuid(),'x','activity','x',1);"
          assert_denied fde_agent "SELECT hitl.merge_proposal(1,'x');"
          assert_denied fde_agent "UPDATE wf.workflow SET status='published';"
          assert_denied fde_agent "UPDATE trn.trace_session SET outcome='accepted';"
          assert_denied fde_rl_rollout "INSERT INTO hitl.proposal (engagement_id,title,rationale,authored_by,agent_name) VALUES (gen_random_uuid(),'t','r','a','engagement');"
          assert_denied fde_rl_rollout "UPDATE trn.trace_session SET outcome='accepted';"
          exit $fail

  # -------------------------------------------------------------------
  # Python tests. Runs against the same pgvector image so the DB-marked
  # tests actually execute rather than skipping.
  # -------------------------------------------------------------------
  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.0-pg16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fde
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: fde
      FDE_DB_DSN: postgresql://postgres:postgres@localhost:5432/fde
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: install psql client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: apply schema
        run: ./db/rebuild.sh fde
      - run: uv sync --all-packages --frozen
      - name: pytest
        run: uv run pytest packages --cov --cov-report=term-missing

  # -------------------------------------------------------------------
  # Images must actually build for ARM64. Not pushed on PRs.
  # -------------------------------------------------------------------
  images:
    runs-on: ubuntu-latest
    needs: [static]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: fde-mcp,         dockerfile: packages/fde-mcp/Dockerfile,    agent: "" }
          - { name: fde-engagement,  dockerfile: packages/fde-agents/Dockerfile, agent: engagement }
          - { name: fde-workflow,    dockerfile: packages/fde-agents/Dockerfile, agent: workflow }
          - { name: fde-development, dockerfile: packages/fde-agents/Dockerfile, agent: development }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: build ${{ matrix.name }} (linux/arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/arm64
          build-args: ${{ matrix.agent && format('AGENT={0}', matrix.agent) || '' }}
          push: false
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
