name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_FROZEN: "1"          # every uv command in this workflow refuses to resolve
  PYTHON_VERSION: "3.12"

jobs:
  # -------------------------------------------------------------------
  # Lint and types. Fast, no services, fails the PR before anything slow runs.
  # -------------------------------------------------------------------
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - run: uv sync --all-packages --frozen
      - name: ruff check
        run: uv run ruff check packages
      - name: ruff format
        run: uv run ruff format --check packages
      - name: mypy (strict)
        run: uv run mypy packages/fde-mcp/src packages/fde-agents/src packages/fde-gate/src packages/fde-sor/src
      - name: lockfile is current
        run: uv lock --check

  # -------------------------------------------------------------------
  # The CDK launch stack: its own uv project (infra/cdk/pyproject.toml +
  # uv.lock), deliberately NOT a workspace member -- `uv sync --frozen`
  # here must never touch the packages/* venv. Synth uses no AWS
  # credentials and no CDK bootstrap; cfn-lint validates the emitted
  # template. Not yet in the branch-protection required list -- add it
  # when this PR merges.
  # -------------------------------------------------------------------
  cdk-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
      - name: synth and lint the launch stack (no AWS credentials)
        working-directory: infra/cdk
        run: |
          uv sync --frozen
          uv run pytest tests
          uv run python app.py
          # -i W3005 only, as of task 6: task 2's Parameters/Conditions
          # were consumed incrementally as tasks 3-6 landed (task 3 wired
          # deploy_tier/is_production into the database construct; task 5
          # retired W7001 entirely by giving AssetsRegionMap/ReleaseTag/
          # AssetsBucket their first consumer; task 6 retired W2001 and
          # W8001 entirely by giving every remaining parameter/condition a
          # consumer in the gate Lambda/Fargate services' envs) -- see
          # infra/cdk/README.md's cfn-lint ledger, which tracks exactly
          # which occurrences of each rule remain. W3005 (redundant
          # DependsOn on an explicit Lambda role/ECS target-group wiring --
          # CDK adds it on purpose, for eventual-consistency reasons) is
          # expected to stay in this list permanently, not just until some
          # later task lands. This rule ID MUST come after the template
          # path: cfn-lint's -i takes an unbounded arg list and would
          # otherwise swallow the path itself.
          uv run cfn-lint cdk.out/FdePlatform.template.json -i W3005
      - name: lockfile is current
        working-directory: infra/cdk
        run: uv lock --check

  # -------------------------------------------------------------------
  # The database contract: migrations must apply IN ORDER on an EMPTY
  # database and all smoke tests must pass. This is the gate that protects
  # the platform's core invariant.
  # -------------------------------------------------------------------
  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        # pgvector >= 0.8.0 is a correctness requirement, not a perf one --
        # below it, filtered ANN queries silently return incomplete results.
        image: pgvector/pgvector:0.8.0-pg16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fde
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: fde
    steps:
      - uses: actions/checkout@v4
      - name: install psql client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: migrations + 25 smoke tests
        run: ./db/rebuild.sh fde
      - name: core invariants must hold
        # These twenty-nine statements MUST all fail. If any succeeds, an
        # agent can write the graph, publish a workflow, label its own
        # training data, appoint its own reviewer, rewrite the evidence a
        # reviewer checked a proposal against, or forge the record of who
        # asked for a piece of work, and the platform's central guarantee is
        # gone. Asserted here rather than trusted.
        #
        # The first eight are the original set: they are the four-layer
        # invariant itself, and their roles, targets and claims are not to be
        # edited. On 2026-08-03 three of them had their statement SHAPE --
        # and only that -- rewritten, because a guard that cannot detect the
        # break it guards is not a guard. Each of the three still failed
        # after the privilege it asserts had been granted, so assert_denied
        # would have printed "ok" straight through a broken invariant: the
        # kg.node INSERT named commit_id 1, which no database has ever had
        # (rebuild.sh's smoke test consumes the identity values and rolls
        # back, so the demo seed's own commits start at 7), and died on
        # node_commit_id_fkey; the two SECURITY DEFINER calls pass a proposal
        # and a workflow id that do not exist, so the body raises "not found"
        # even for a caller that holds EXECUTE. All three now match no rows,
        # which leaves the privilege as the only thing left to fail on. One
        # constraint if the two function lines are ever rewritten: the call
        # must stay in the TOP-LEVEL target list, because wrapping it --
        # `SELECT * FROM (SELECT fn(...) AS r) t WHERE false` -- lets the
        # planner discard the subquery's target list under the constant-false
        # qual, and the EXECUTE check then never fires at all. That failure is
        # at least loud: the line succeeds and trips INVARIANT BROKEN. The
        # standard they were held to, and that any new line must be held to,
        # is both directions: denied for the role under test, and SUCCEEDING
        # once the privilege is granted. That standard is now ENFORCED, not
        # just stated -- assert_denied runs each statement as the migration
        # owner first and requires it to succeed, then requires the role's
        # refusal to be a privilege refusal. A guard that has stopped testing
        # anything fails the step on the owner leg while the invariant still
        # holds; one that is masked only after a grant fails on the denial
        # leg. Neither can print "ok" again.
        #
        # Automating the owner leg required a second SHAPE-only reshape, on
        # 2026-08-03, of the eight statements that were still unqualified --
        # six `UPDATE`/`DELETE` with no WHERE, plus `UPDATE kg.source SET
        # title` and the hitl.proposal INSERT. Run as the owner they wrote to
        # the very tables they protect: the proposal INSERT used a literal
        # VALUES row and inserted one on ANY database, and the kg.source
        # UPDATE rewrote every title (three rows against `--with-demo`); the
        # other six were no-ops only because rebuild.sh happens to leave
        # those tables empty, which is a property of the fixture and not of
        # the statement. All eight now match no rows, and all eight were
        # proven in both directions on an empty and a demo-seeded database
        # before being written down. The proposal INSERT selects literals
        # rather than reading hitl.proposal for the reason the roster block
        # below gives: db/012:55 revokes schema hitl from fde_rl_rollout
        # outright, so its denial fires at the schema either way, and the
        # read-the-target form would additionally need a SELECT it must
        # never hold. The twelve after them
        # guard the reviewer roster (db/016): the console may administer it,
        # nothing else may touch it, and even the console may only write the
        # columns db/016 names. Five more guard evidence intake
        # (db/017), which gave the console INSERT on three kg tables: the
        # grant must not have widened into UPDATE, DELETE, the graph
        # tables, or a second role. The last four guard the launch record
        # (db/018), and each was proven in both directions before it was
        # written down.
        run: |
          set -u
          fail=0
          # Both directions, machine-checked, in the order they have to run.
          #
          # OWNER LEG: the same statement as the migration owner must SUCCEED.
          # That is what proves the statement is valid SQL that gets far
          # enough to be refused for a privilege and nothing else -- the
          # automated form of the hand audit that found the dead guards. A
          # guard that has quietly stopped testing anything now fails here
          # WHILE THE INVARIANT STILL HOLDS, instead of waiting for the grant
          # that breaks it.
          #
          # DENIAL LEG: a nonzero psql exit is not evidence by itself. A typo,
          # a foreign key, a "not found" raised inside a SECURITY DEFINER
          # body, or a dead connection all used to print "ok". The refusal
          # must be postgres's own, matched on its message and anchored to the
          # start of the line so that psql's echo of the failing statement
          # cannot itself supply the words. Every current denial phrases it
          # "permission denied for <table|function|schema> X", so the shared
          # prefix is the tightest pattern covering all twenty-nine.
          #
          # Both legs run inside BEGIN/ROLLBACK. The twenty-nine are no-op
          # forms by construction and each was proven to touch zero rows, so
          # this changes no result today; it is here so that a future line
          # that is NOT a no-op cannot make CI write to the tables these
          # statements exist to protect -- including on the denial leg, which
          # does execute the statement in exactly the case where a grant has
          # already widened. Anything unexpected fails the step and names the
          # line that proved nothing.
          assert_denied() {
            local err
            if ! err="$(psql -v ON_ERROR_STOP=1 -q -c "BEGIN; $2 ROLLBACK;" 2>&1 >/dev/null)"; then
              echo "::error::GUARD DEAD -- the migration owner cannot run this, so it never reaches a privilege check: $2 -- got: $(head -1 <<<"$err")"; fail=1
              return
            fi
            if err="$(psql -v ON_ERROR_STOP=1 -q -c "BEGIN; SET ROLE $1; $2 ROLLBACK;" 2>&1 >/dev/null)"; then
              echo "::error::INVARIANT BROKEN -- '$1' was able to: $2"; fail=1
            elif grep -Eq '^ERROR: +permission denied for ' <<<"$err"; then
              echo "ok: $1 denied (owner ok) -- ${2:0:60}"
            else
              echo "::error::GUARD DEAD -- '$1' was refused, but not by a privilege, so this line proves nothing: $2 -- got: $(head -1 <<<"$err")"; fail=1
            fi
          }
          assert_denied fde_agent "INSERT INTO kg.node (engagement_id,node_key,node_type,label,commit_id) SELECT gen_random_uuid(),'x','activity','x',1 WHERE false;"
          assert_denied fde_agent "SELECT hitl.merge_proposal(1,'x') WHERE false;"
          assert_denied fde_agent "UPDATE wf.workflow SET status='published' WHERE false;"
          assert_denied fde_agent "UPDATE trn.trace_session SET outcome='accepted' WHERE false;"
          assert_denied fde_rl_rollout "INSERT INTO hitl.proposal (engagement_id,title,rationale,authored_by,agent_name) SELECT gen_random_uuid(),'t','r','a','engagement' WHERE false;"
          assert_denied fde_rl_rollout "UPDATE trn.trace_session SET outcome='accepted' WHERE false;"
          assert_denied fde_agent "SELECT wf.publish_workflow(1,'x') WHERE false;"
          assert_denied fde_prodops "UPDATE wf.workflow SET status='published' WHERE false;"

          # The reviewer roster decides who may clear a gate. An agent that
          # could add a reviewer, grant an authority, or reactivate itself
          # would be choosing its own judge -- the invariant above, defeated
          # one layer up. Only fde_gate_service writes these tables (db/016),
          # and even it may not DELETE a reviewer or rewrite a principal:
          # gate decisions reference the row, so both would rewrite history.
          #
          # Every write below matches no rows on purpose -- `WHERE false` on
          # the UPDATEs and the DELETE, a literal source on the INSERTs.
          # Privileges are checked when a statement is planned rather than
          # when a row is reached, so each one still fails for exactly one
          # reason: the missing grant. Unqualified, they did not. The two
          # INSERTs that named reviewer_id 1 failed on a foreign key EVEN FOR
          # THE OWNER, a rebuilt database having no reviewer 1; against a
          # populated roster the DELETE hits the authority and decision
          # tables' foreign keys, and the principal and gate_kind UPDATEs hit
          # a unique constraint; and the two identical reviewer INSERTs are
          # asserted for two different roles, so a grant that widened for the
          # first would leave the second colliding on the unique principal.
          # Every one of those would keep assert_denied printing "ok" after
          # the invariant is already broken -- the class the owner leg now
          # catches outright. The shapes stay qualified regardless, so no
          # line's detection power depends on that leg being there.
          #
          # The INSERTs select literals rather than reading the target the
          # way db/017's pair below does, because that form would leave two
          # of these roles denying for the wrong reason: fde_prodops holds no
          # SELECT on the roster tables, and fde_rl_rollout cannot reach them
          # at all -- db/012:55 revokes schema hitl from it outright, which is
          # the barrier its line actually hits and why that one denies on the
          # schema rather than on the table.
          assert_denied fde_agent "INSERT INTO hitl.reviewer (principal,display_name) SELECT 'x','x' WHERE false;"
          assert_denied fde_agent "UPDATE hitl.reviewer SET is_active = true WHERE false;"
          assert_denied fde_agent "INSERT INTO hitl.reviewer_authority (reviewer_id,engagement_id,gate_kind,granted_by) SELECT 1,gen_random_uuid(),'control','x' WHERE false;"
          assert_denied fde_agent "UPDATE hitl.reviewer_authority SET revoked_at = NULL WHERE false;"
          assert_denied fde_agent "SELECT count(*) FROM hitl.reviewer_admin;"
          assert_denied fde_prodops "INSERT INTO hitl.reviewer (principal,display_name) SELECT 'x','x' WHERE false;"
          assert_denied fde_training "UPDATE hitl.reviewer SET is_active = false WHERE false;"
          assert_denied fde_rl_rollout "INSERT INTO hitl.reviewer_admin (reviewer_id,granted_by) SELECT 1,'x' WHERE false;"
          assert_denied fde_gate_service "DELETE FROM hitl.reviewer WHERE false;"
          assert_denied fde_gate_service "UPDATE hitl.reviewer SET principal = 'x' WHERE false;"
          # The column-scoped UPDATE, asserted from the other side: the gate
          # service may stamp revoked_at/granted_by/granted_at and is_active,
          # and may not touch the primary key of an authority (moving one is
          # granting a different one) or a reviewer's display name.
          assert_denied fde_gate_service "UPDATE hitl.reviewer_authority SET gate_kind = 'factual' WHERE false;"
          assert_denied fde_gate_service "UPDATE hitl.reviewer SET display_name = 'x' WHERE false;"

          # db/017 lets the console accept a pasted transcript: INSERT on
          # kg.source, kg.chunk and kg.embed_queue, and nothing else. Chunks
          # are the verbatim evidence a reviewer reads to check a proposal,
          # so a console that could rewrite or delete one could rewrite the
          # justification for a claim a human already agreed to -- and a
          # source row is INSERT-only because re-ingest is a new version,
          # which is only an audit trail if the old one cannot be edited.
          # The fourth line is the important one: the write reaches evidence
          # tables and stops there. hitl.merge_proposal remains the only
          # path by which anything in this platform writes the graph.
          assert_denied fde_gate_service "UPDATE kg.chunk SET content = 'x' WHERE false;"
          assert_denied fde_gate_service "DELETE FROM kg.chunk WHERE false;"
          assert_denied fde_gate_service "UPDATE kg.source SET title = 'x' WHERE false;"
          # These two are `SELECT ... WHERE false` rather than VALUES, and the
          # difference decides whether they test anything. A literal VALUES row
          # has to name a commit_id and a source_id, which do not exist -- so it
          # fails on a foreign key EVEN FOR THE OWNER, which is now precisely
          # what the owner leg reports as a dead guard, and which before that
          # leg existed let assert_denied print "ok" after a widened grant had
          # already broken the invariant. Selecting zero rows from the table
          # itself inserts nothing,
          # succeeds trivially wherever the privilege is held, and can therefore
          # fail for exactly one reason. One caveat comes with reading the
          # target table: this form needs SELECT as well as INSERT, so
          # revoking fde_gate_service's SELECT on kg.node or fde_prodops's on
          # kg.chunk would leave both lines denying for the wrong reason.
          assert_denied fde_gate_service "INSERT INTO kg.node (engagement_id,node_key,node_type,label,commit_id) SELECT engagement_id,node_key,node_type,label,commit_id FROM kg.node WHERE false;"
          assert_denied fde_prodops "INSERT INTO kg.chunk (engagement_id,source_id,ordinal,content) SELECT engagement_id,source_id,ordinal,content FROM kg.chunk WHERE false;"

          # db/018 records console agent launches in wf.agent_launch, so a
          # launch that outlives its HTTP request still leaves a trace. The
          # row is an attribution -- this person asked for this task on this
          # engagement -- and the four lines below are what makes it one.
          # An agent that could INSERT here could file a record claiming a
          # human asked for work the human never asked for, which is the
          # propose/dispose invariant defeated in the audit trail rather
          # than in the graph; one that could UPDATE could mark its own
          # launch succeeded. The console writes the row and may stamp only
          # how it ended: status, runtime_session_id, error, completed_at.
          # Rewriting `principal` is refused for the reason db/016 refuses
          # it on hitl.reviewer -- it re-points a record at somebody who did
          # not make it -- and the same grant withholds agent, task,
          # engagement_id and input, which are the rest of the request.
          # Nothing holds DELETE, because a history that can be deleted
          # answers "did this run?" only until somebody would rather it did
          # not.
          #
          # The INSERT selects literals rather than reading the target the
          # way db/017's pair does, and that is required here rather than a
          # preference: wf.agent_launch is a NEW table, so db/010's
          # `ALL TABLES IN SCHEMA wf` never reached it and fde_agent holds
          # no SELECT on it either -- the read-the-target form would deny on
          # the missing SELECT and keep printing "ok" after INSERT had been
          # granted. All four match no rows, so the privilege is the only
          # thing left to fail on, and all four were run in both directions
          # against a rebuilt database: denied as written, and succeeding
          # once the privilege each one names had been granted.
          assert_denied fde_agent "INSERT INTO wf.agent_launch (engagement_id,agent,task,principal) SELECT gen_random_uuid(),'engagement','ingest_interview','x' WHERE false;"
          assert_denied fde_agent "UPDATE wf.agent_launch SET status = 'succeeded' WHERE false;"
          assert_denied fde_gate_service "UPDATE wf.agent_launch SET principal = 'x' WHERE false;"
          assert_denied fde_gate_service "DELETE FROM wf.agent_launch WHERE false;"
          exit $fail

  # -------------------------------------------------------------------
  # Python tests. Runs against the same pgvector image so the DB-marked
  # tests actually execute rather than skipping.
  # -------------------------------------------------------------------
  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.0-pg16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fde
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: fde
      FDE_DB_DSN: postgresql://postgres:postgres@localhost:5432/fde
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: install psql client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: apply schema
        run: ./db/rebuild.sh fde
      - run: uv sync --all-packages --frozen
      - name: pytest
        run: uv run pytest packages --cov --cov-report=term-missing

  # -------------------------------------------------------------------
  # The heavy-ML surface: trainers, token-level mask verification, and the
  # docs<->code sync checks. Runs the [train] extra in its own job because
  # syncing that extra reshapes the venv (it drops sibling packages' deps).
  # No DB service: the db-marked cases in these files skip without a DSN.
  # -------------------------------------------------------------------
  train-tests:
    runs-on: ubuntu-latest
    needs: [static]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - run: uv sync --package fde-training --extra train --frozen
      - name: trainer configs, token-level masking, docs sync
        run: >
          uv run --no-sync pytest
          packages/fde-training/tests/test_train.py
          packages/fde-training/tests/test_verify_masking.py
          packages/fde-training/tests/test_docs_sync.py

  # -------------------------------------------------------------------
  # Images must actually build for ARM64. Not pushed on PRs.
  # -------------------------------------------------------------------
  images:
    runs-on: ubuntu-latest
    needs: [static]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: fde-mcp,         dockerfile: packages/fde-mcp/Dockerfile,    agent: "" }
          - { name: fde-engagement,  dockerfile: packages/fde-agents/Dockerfile, agent: engagement }
          - { name: fde-workflow,    dockerfile: packages/fde-agents/Dockerfile, agent: workflow }
          - { name: fde-development, dockerfile: packages/fde-agents/Dockerfile, agent: development }
          - { name: fde-sor,         dockerfile: packages/fde-sor/Dockerfile,    agent: "" }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v4
      - name: build ${{ matrix.name }} (linux/arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/arm64
          build-args: ${{ matrix.agent && format('AGENT={0}', matrix.agent) || '' }}
          push: false
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  # -------------------------------------------------------------------
  # Deploy (docs/09 §8): main only, gated behind the `production`
  # environment's required reviewers. Skips cleanly on forks / repos
  # without AWS secrets -- a job-level `if:` cannot read secrets, so a
  # check step emits an output instead.
  # -------------------------------------------------------------------
  deploy:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    needs: [static, database, tests, train-tests, images]
    runs-on: ubuntu-latest
    environment: production
    # id-token: write is REQUIRED for aws-actions/configure-aws-credentials'
    # OIDC role-assumption below -- GITHUB_TOKEN's id-token scope defaults
    # to `none` regardless of the repo's default token-permission setting,
    # so it must be requested explicitly. Unlisted scopes default to
    # `none` too once any `permissions:` key is present, hence `contents:
    # read` alongside it (actions/checkout needs it).
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: check AWS secrets present
        id: creds
        run: |
          if [ -n "${{ secrets.AWS_DEPLOY_ROLE_ARN }}" ]; then
            echo "have=true" >> "$GITHUB_OUTPUT"
          else
            echo "have=false" >> "$GITHUB_OUTPUT"
            echo "AWS secrets not configured -- deploy steps skipped."
          fi
      - uses: astral-sh/setup-uv@v7
        if: steps.creds.outputs.have == 'true'
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - uses: aws-actions/configure-aws-credentials@v4
        if: steps.creds.outputs.have == 'true'
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - run: uv sync --all-packages --frozen
        if: steps.creds.outputs.have == 'true'
      - name: stage + upload codezip artifacts
        if: steps.creds.outputs.have == 'true'
        run: uv run fde-agents-deploy codezip --agents engagement workflow development --code-bucket ${{ vars.FDE_CODE_BUCKET }}
      # `runtimes.py --update` takes the AGENT_RUNTIME_ID to update as its
      # value (not a bare flag) and its `update_requires_single_agent`
      # guard rejects any `--agents` list longer than one -- see
      # `runtimes.py:161` (`update_runtime`) and `_parse_args`/`main`. The
      # previous single-step, three-agent, bare-flag `--update` invocation
      # here was rejected by that guard on every run; the secrets gate
      # (`steps.creds`) simply meant it never fired outside a real deploy,
      # so the break was latent. Three per-agent steps, each passing the
      # runtime's own AgentCore runtime ID via a repo variable (see
      # infra/cdk/RELEASING.md for how these are obtained and set).
      - name: update engagement agent runtime
        if: steps.creds.outputs.have == 'true'
        run: >
          uv run fde-agents-deploy runtimes
          --agents engagement
          --update ${{ vars.FDE_RUNTIME_ID_ENGAGEMENT }}
          --role-arn ${{ secrets.FDE_RUNTIME_ROLE_ARN }}
          --artifact-mode code --code-bucket ${{ vars.FDE_CODE_BUCKET }}
      - name: update workflow agent runtime
        if: steps.creds.outputs.have == 'true'
        run: >
          uv run fde-agents-deploy runtimes
          --agents workflow
          --update ${{ vars.FDE_RUNTIME_ID_WORKFLOW }}
          --role-arn ${{ secrets.FDE_RUNTIME_ROLE_ARN }}
          --artifact-mode code --code-bucket ${{ vars.FDE_CODE_BUCKET }}
      - name: update development agent runtime
        if: steps.creds.outputs.have == 'true'
        run: >
          uv run fde-agents-deploy runtimes
          --agents development
          --update ${{ vars.FDE_RUNTIME_ID_DEVELOPMENT }}
          --role-arn ${{ secrets.FDE_RUNTIME_ROLE_ARN }}
          --artifact-mode code --code-bucket ${{ vars.FDE_CODE_BUCKET }}
      - name: update RFT grader lambda
        if: steps.creds.outputs.have == 'true'
        run: >
          uv run fde-training rft-submit deploy-grader --update
          --function-name fde-rft-grader
          --role-arn ${{ secrets.FDE_GRADER_ROLE_ARN }}
          --region ${{ vars.AWS_REGION }}
      - name: smoke test deployed runtimes
        if: steps.creds.outputs.have == 'true'
        env:
          FDE_SMOKE_RUNTIME_ARN: ${{ vars.FDE_SMOKE_RUNTIME_ARN }}
